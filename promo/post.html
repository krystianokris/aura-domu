<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Aura domu — grafika na Facebooka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
  /* ?format=post (1080×1350, pion) albo ?format=wide (1200×630, link / okładka) */
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:'Inter Tight',system-ui,sans-serif;color:#20252a;
    background:radial-gradient(ellipse 70% 55% at 78% 30%,#f9ddcf 0,transparent 62%),radial-gradient(ellipse 60% 50% at 10% 95%,#dde6f3 0,transparent 60%),linear-gradient(160deg,#f3f5f8,#e5e9ee)}
  .stage{position:relative;width:100%;height:100%}
  .brand{display:flex;align-items:center;gap:14px;font-weight:600;letter-spacing:-.02em}
  .mark{width:44px;height:44px;border:1.6px solid #8e989b;border-radius:50%;position:relative;transform:rotate(-33deg);flex:none}
  .mark::before{content:'';position:absolute;inset:10px -5px;border:1.6px solid #8e989b;border-radius:50%;transform:rotate(-12deg)}
  .mark::after{content:'';position:absolute;left:31px;top:8px;width:13px;height:13px;border-radius:50%;background:#e68768;border:3px solid #eef1f4}
  h1{font-weight:400;letter-spacing:-.065em;line-height:.98}
  .sub{color:#59636b;letter-spacing:-.01em}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:8px 15px;border-radius:999px;background:linear-gradient(145deg,#f8fafb,#e3e7ec);border:1px solid #fff;box-shadow:-4px -4px 9px #fff,5px 6px 12px #21314926;font-size:17px;font-weight:500;color:#20252a}
  .chip b{color:#9d4935;font-weight:600}
  .device{position:absolute;background:#16191f;box-shadow:0 40px 70px -28px #1d2a3d80,0 0 0 1px #0000000d;overflow:hidden}
  .device iframe{border:0;display:block;transform-origin:0 0;pointer-events:none}
  .tablet{border-radius:30px;padding:16px}
  .tablet .screen{border-radius:16px;overflow:hidden;position:relative}
  .phone{border-radius:46px;padding:11px}
  .phone .screen{border-radius:36px;overflow:hidden}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;color:#59636b}
  .foot b{display:block;color:#20252a;font-weight:600;letter-spacing:-.02em}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:#20252a;color:#fff;font-weight:600;letter-spacing:.01em}
  .badge i{width:9px;height:9px;border-radius:50%;background:#e68768;box-shadow:0 0 10px #e68768}

  /* --- pion 1080×1350 --- */
  .post .brand{position:absolute;left:72px;top:70px;font-size:30px}
  .post h1{position:absolute;left:72px;top:128px;font-size:96px}
  .post .sub{position:absolute;left:76px;top:338px;font-size:29px;max-width:860px}
  .post .tablet{left:72px;top:448px;width:878px}
  .post .tablet .screen{width:846px;height:529px}
  .post .phone{right:56px;top:690px;width:300px}
  .post .phone .screen{width:278px;height:602px}
  .post .chips{position:absolute;left:72px;top:1040px;width:600px}
  .post .foot{position:absolute;left:72px;bottom:58px;font-size:21px;flex-direction:column;align-items:flex-start;gap:16px}
  .post .foot b{font-size:27px}

  /* --- poziom 1200×630 --- */
  .wide .brand{position:absolute;left:60px;top:54px;font-size:24px}
  .wide .brand .mark{width:36px;height:36px}
  .wide .brand .mark::after{left:25px;top:6px;width:11px;height:11px}
  .wide h1{position:absolute;left:60px;top:104px;font-size:58px}
  .wide .sub{position:absolute;left:62px;top:236px;font-size:20px;width:390px}
  .wide .chips{position:absolute;left:60px;top:326px;width:420px}
  .wide .chip{font-size:14px;padding:7px 12px}
  .wide .tablet{left:490px;top:70px;width:660px;padding:12px;border-radius:24px}
  .wide .tablet .screen{width:636px;height:398px;border-radius:12px}
  .wide .phone{right:30px;top:206px;width:196px;padding:8px;border-radius:32px}
  .wide .phone .screen{width:180px;height:390px;border-radius:25px}
  .wide .foot{position:absolute;left:60px;bottom:48px;width:400px;font-size:16px;flex-direction:column;align-items:flex-start;gap:14px}
  .wide .foot b{font-size:20px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="brand"><span class="mark"></span>Aura domu</div>
  <h1>Twój dom<br>na jednym ekranie</h1>
  <p class="sub">Pulpit na cały ekran dla Home Assistanta. Darmowy, po polsku, na tablet i telefon.</p>
  <div class="device tablet"><div class="screen"><iframe id="tab" title=""></iframe></div></div>
  <div class="device phone"><div class="screen"><iframe id="ph" title=""></iframe></div></div>
  <div class="chips">
    <span class="chip">Pokoje</span><span class="chip">Klimat</span><span class="chip">Ogrzewanie</span><span class="chip">Pogoda</span>
    <span class="chip">Energia</span><span class="chip">Ochrona</span><span class="chip">Kosze</span><span class="chip"><b>F1</b> na żywo</span>
  </div>
  <div class="foot">
    <div><b>github.com/krystianokris/aura-domu</b>demo: krystianokris.github.io/aura-domu/demo</div>
    <span class="badge"><i></i>HACS · beta 0.9</span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search), wide = q.get('format') === 'wide';
  document.getElementById('stage').classList.add(wide ? 'wide' : 'post');
  // ekrany: żywe demo w iframe, renderowane w pełnym rozmiarze i pomniejszone
  const fit = (id, w, h, src) => { const f = document.getElementById(id), box = f.parentElement; f.width = w; f.height = h; f.src = src;
    const s = box.clientWidth / w; f.style.transform = `scale(${s})`; box.style.height = `${Math.round(h * s)}px`; };
  addEventListener('load', () => {
    fit('tab', 1280, 800, `../demo/?theme=${q.get('tab') || 'light'}${q.get('tabhash') ? '#' + q.get('tabhash') : ''}`);
    fit('ph', 390, 844, `../demo/?theme=${q.get('phone') || 'dark'}#${q.get('phonehash') || 'pogoda'}`);
  });
</script>
</body>
</html>
